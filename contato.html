<body>

  <div id="header-placeholder"></div>

  <main>

<section class="contact-section" id="contato">

    <div class="contact-section__container">

        <div class="contact-section__header">
            <h2 class="contact-section__title">
                Vamos conversar sobre<br>
                educação que gera resultado
            </h2>
            <div class="contact-section__deco" aria-hidden="true">
                <img src="/assets/images/detail-contact.png" alt="">
            </div>
        </div>

        <div class="contact-section__grid">

            <!-- FORMULÁRIO -->
            <div class="contact-card">
                <p class="contact-card__label">Fale com um especialista</p>

                <form
                    class="contact-form"
                    id="contact-form"
                    action="https://api.web3forms.com/submit"
                    method="POST"
                >
                    <!-- Chave de acesso do Web3Forms -->
                    <input type="hidden" name="access_key" value="cc1fe38b-89cb-43ac-833e-581bbfb1ea05">

                    <!-- Assunto do e-mail de notificação -->
                    <input type="hidden" name="subject" value="Novo contato via site IntraAct Brasil">

                    <div class="contact-form__row">
                        <div class="contact-form__field">
                            <label for="nome">Nome completo*</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>
                        <div class="contact-form__field">
                            <label for="email">E-mail*</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>

                    <div class="contact-form__row">
                        <div class="contact-form__field">
                            <label for="telefone">Telefone (opcional)</label>
                            <input type="tel" id="telefone" name="telefone">
                        </div>
                        <div class="contact-form__field">
                            <label for="organizacao">Organização / Rede de ensino*</label>
                            <input type="text" id="organizacao" name="organizacao" required>
                        </div>
                    </div>

                    <div class="contact-form__field contact-form__field--full">
                        <label for="mensagem">Mensagem*</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                    </div>

                    <!-- Honeypot anti-spam do Web3Forms (deixe escondido, não remover) -->
                    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

                    <button type="submit" class="btn-outline btn-outline--orange contact-form__submit">
                        <span class="contact-form__submit-text">FALE COM UM ESPECIALISTA →</span>
                        <span class="contact-form__submit-loading" hidden>ENVIANDO...</span>
                    </button>

                    <p class="contact-form__feedback" role="status" aria-live="polite"></p>
                </form>
            </div>

            <!-- INFO LATERAL -->
            <aside class="contact-info">

                <div class="contact-info__block">
                    <div class="contact-info__heading">
                        <span class="contact-info__icon">
                            <img src="/assets/icons/icon-atendimento.svg" alt="" width="24" height="24">
                        </span>
                        <h3>Atendimento</h3>
                    </div>
                    <p class="contact-info__text">
                        Atendimento nacional. Projetos em redes públicas e privadas de ensino.
                    </p>
                </div>

                <div class="contact-info__block">
                    <div class="contact-info__heading">
                        <span class="contact-info__icon">
                            <img src="/assets/icons/icon-fale-conosco.svg" alt="" width="24" height="24">
                        </span>
                        <h3>Fale conosco</h3>
                    </div>
                    <p class="contact-info__text">
                        <a href="mailto:contato@intraactbrasil.com.br">contato@intraactbrasil.com.br</a><br>
                        <a href="tel:+5531991298190">(31) 99129-8190</a>
                    </p>
                </div>

            </aside>

        </div>

    </div>

</section>

  </main>

  <div id="footer-placeholder"></div>

  <script src="js/includes.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/contact-form.js?v=3"></script>

</body>
</html>
